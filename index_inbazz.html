<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard UGC · Inbazz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --blue-900: #020E25;
  --blue-700: #14274A;
  --blue-500: #2D426E;
  --blue-100: #E6EAF1;
  --red-700:  #E53A2E;
  --red-500:  #F46557;
  --red-100:  #FCE6E3;
  --white:    #FAF9F8;
  --white-2:  #FFFFFF;
  --gray-200: #EDEAE7;
  --gray-300: #D9D5D0;
  --gray-500: #B5AFA8;
  --gray-700: #757575;
  --gray-850: #4E4E4E;
  --green-700: #2D8659;
  --green-100: #DCEFE5;
  --gold:   #C99209;
  --silver: #6B7280;
  --bronze: #B45309;
  --shadow-sm: 0 1px 2px rgba(20,39,74,.06);
  --shadow-md: 0 6px 24px rgba(20,39,74,.07);
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-body:    'Manrope', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--white); color: var(--gray-850); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
body { padding: 24px 28px 60px; }

.topbar { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 18px; border-bottom: 1px solid var(--gray-200); margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand-logo { width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; font-size: 22px; background: var(--blue-700); color: var(--white); box-shadow: var(--shadow-sm); }
.brand-meta h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; margin: 0 0 4px; letter-spacing: -.02em; line-height: 1; color: var(--blue-900); }
.brand-meta p { margin: 0; color: var(--gray-700); font-size: 12.5px; letter-spacing: .02em; }
.brand-selector { display: flex; gap: 4px; margin-left: 8px; padding: 3px; background: var(--blue-100); border-radius: 10px; }
.brand-selector button { background: transparent; color: var(--blue-700); border: 0; padding: 7px 14px; border-radius: 7px; font: inherit; font-weight: 600; font-size: 12.5px; cursor: pointer; transition: all .15s; }
.brand-selector button:hover { color: var(--blue-900); }
.brand-selector button.active { background: var(--white-2); color: var(--blue-900); box-shadow: var(--shadow-sm); }
.live { display: inline-flex; align-items: center; gap: 8px; color: var(--gray-700); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-700); box-shadow: 0 0 0 4px var(--green-100); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 4px var(--green-100); } 50% { box-shadow: 0 0 0 8px transparent; } }

.section-label { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .18em; color: var(--blue-700); text-transform: uppercase; margin: 28px 0 12px; }
.section-label:first-of-type { margin-top: 4px; }

.grid { display: grid; gap: 14px; }
.card { background: var(--white-2); border: 1px solid var(--gray-200); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; transition: box-shadow .15s; }
.card:hover { box-shadow: var(--shadow-md); }
.card h3 { font-family: var(--font-body); font-size: 10.5px; font-weight: 700; letter-spacing: .14em; color: var(--gray-700); text-transform: uppercase; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h3 .mom { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0; }
.mom.up   { background: var(--green-100); color: var(--green-700); }
.mom.down { background: var(--red-100);   color: var(--red-700); }
.mom.flat { background: var(--gray-200);  color: var(--gray-700); }

.row-overview { display: grid; grid-template-columns: 1.55fr 1fr 1fr 1fr; gap: 14px; }
.row-overview .card { min-height: 230px; }
.row-kpis-extra { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 14px; }
.kpi-card .big { font-family: var(--font-display); font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -.02em; color: var(--blue-900); }
.kpi-card .lbl { font-size: 11.5px; color: var(--gray-700); margin-top: 6px; line-height: 1.4; }
.row-farmers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row-ranking-efic { display: grid; grid-template-columns: 0.95fr 1.05fr; gap: 14px; margin-top: 14px; }
.row-pareto { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.row-sdr { display: grid; grid-template-columns: 0.45fr 0.55fr 1fr; gap: 14px; }

@media (max-width: 1180px) {
  .row-overview, .row-kpis-extra, .row-sdr { grid-template-columns: 1fr 1fr; }
  .row-overview > .card:first-child { grid-column: 1 / -1; }
  .row-ranking-efic { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  body { padding: 14px; }
  .row-overview, .row-farmers, .row-pareto, .row-sdr, .row-kpis-extra, .row-ranking-efic { grid-template-columns: 1fr; }
}

.legend { display: flex; gap: 14px; align-items: center; margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--gray-700); font-size: 11.5px; }
.legend .swatch { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
.legend .dashed { background: repeating-linear-gradient(90deg, var(--blue-700) 0 4px, transparent 4px 8px); height: 2px; }
.chart-wrap { width: 100%; height: 170px; }
.chart svg { width: 100%; height: 100%; display: block; }

.donut-row { display: flex; align-items: center; gap: 14px; }
.donut-svg { width: 100px; height: 100px; flex-shrink: 0; }
.donut-legend { font-size: 12.5px; color: var(--blue-900); display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.donut-legend .line { display: flex; align-items: baseline; gap: 6px; }
.donut-legend .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
.donut-legend strong { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--blue-900); }
.donut-legend small { color: var(--gray-700); font-size: 11.5px; }
.donut-foot { margin-top: 14px; font-size: 12px; color: var(--gray-700); padding-top: 10px; border-top: 1px dashed var(--gray-200); }
.donut-foot strong { color: var(--blue-900); }

.bars-grouped { display: flex; align-items: end; justify-content: space-around; height: 200px; padding: 8px 12px 36px; position: relative; }
.bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; min-width: 0; position: relative; }
.bar-stack { display: flex; align-items: end; gap: 8px; height: 100%; width: 100%; justify-content: center; }
.bar { width: 44px; border-radius: 8px 8px 4px 4px; position: relative; transition: transform .2s, filter .2s; }
.bar:hover { transform: translateY(-3px); filter: brightness(1.06); }
.bar-value { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--blue-900); }
.bar-mom { position: absolute; top: -42px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 700; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
.bar-label { font-size: 12.5px; font-weight: 600; color: var(--gray-700); position: absolute; bottom: -28px; text-align: center; width: 100%; }
.bar-track { background: var(--gray-200); }
.bar-track .bar-value { color: var(--gray-700); }

.pareto-wrap { width: 100%; height: 250px; }
.pareto-svg { width: 100%; height: 100%; }

.podium { display: flex; flex-direction: column; gap: 10px; }
.podium-row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--white-2); border: 1px solid var(--gray-200); transition: transform .2s; }
.podium-row:hover { transform: translateX(2px); }
.podium-row.gold   { background: linear-gradient(90deg, rgba(201,146,9,.10), rgba(201,146,9,0)); border-color: rgba(201,146,9,.35); }
.podium-row.silver { background: linear-gradient(90deg, rgba(107,114,128,.08), rgba(107,114,128,0)); border-color: rgba(107,114,128,.25); }
.podium-row.bronze { background: linear-gradient(90deg, rgba(180,83,9,.08), rgba(180,83,9,0)); border-color: rgba(180,83,9,.25); }
.podium-medal { font-size: 26px; line-height: 1; text-align: center; }
.podium-pos { font-family: var(--font-display); font-size: 10px; font-weight: 700; color: var(--gray-700); letter-spacing: .12em; text-transform: uppercase; }
.podium-name { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--blue-900); margin-top: 2px; line-height: 1.1; }
.podium-fat { font-family: var(--font-display); font-size: 18px; font-weight: 800; text-align: right; line-height: 1; color: var(--blue-900); }

.efic-table { display: grid; gap: 6px; font-size: 12.5px; }
.efic-head, .efic-row { display: grid; grid-template-columns: 1.3fr 1fr 1fr 0.9fr; gap: 8px; padding: 8px 10px; border-radius: 8px; align-items: center; }
.efic-head { color: var(--gray-700); font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: transparent; padding-bottom: 4px; }
.efic-row { background: var(--white); border: 1px solid var(--gray-200); }
.efic-row strong { font-weight: 700; color: var(--blue-900); }
.efic-row .farmer-tag { display: inline-flex; align-items: center; gap: 8px; }
.efic-row .farmer-tag .dot { width: 8px; height: 8px; border-radius: 50%; }
.efic-num { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 700; color: var(--blue-900); }

.bignum-card { padding: 16px 18px; background: linear-gradient(180deg, rgba(244,101,87,.06), rgba(244,101,87,0)); border-color: rgba(229,58,46,.25); }
.bignum-card.dorm { background: linear-gradient(180deg, rgba(229,58,46,.05), rgba(229,58,46,0)); border-color: rgba(229,58,46,.30); }
.bignum-card.dorm .big { color: var(--red-700); }
.big-bignumber { font-family: var(--font-display); font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -.03em; margin: 4px 0 4px; color: var(--red-700); }
.big-sub { color: var(--gray-700); font-size: 12.5px; margin-bottom: 12px; }
.meta-progress { display: flex; align-items: center; gap: 10px; font-size: 12.5px; flex-wrap: wrap; }
.meta-progress .pct { font-weight: 700; }
.leads-row { display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
.lead-bar-row { display: grid; grid-template-columns: 100px 1fr auto; gap: 12px; align-items: center; }
.lead-name { font-size: 13.5px; font-weight: 600; color: var(--blue-900); }
.lead-track { background: var(--gray-200); border-radius: 999px; height: 14px; overflow: hidden; }
.lead-fill { height: 100%; border-radius: 999px; transition: width .6s; }
.lead-count { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--blue-900); white-space: nowrap; }
.conv-stats { display: grid; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--gray-200); }
.conv-stats .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--gray-700); }
.conv-stats .row strong { color: var(--blue-900); font-weight: 700; }

svg text { fill: var(--gray-700); font-family: var(--font-body); font-size: 10.5px; }

.month-selector { display: flex; gap: 4px; padding: 3px; border-radius: 10px; margin-left: 6px; }
.month-selector select { background: transparent; border: 0; color: inherit; font: inherit; font-weight: 600; font-size: 12.5px; padding: 6px 28px 6px 12px; border-radius: 7px; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238B949E' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 10px center; }
.month-selector select:focus { outline: 1px solid currentColor; outline-offset: 1px; }
.closed-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; letter-spacing: .04em; text-transform: uppercase; }

.month-selector { background: var(--blue-100); }
.month-selector select { color: var(--blue-900); }
.closed-badge { background: var(--gray-200); color: var(--gray-700); }

</style>
</head>
<body>

<div id="app"><div style="padding:40px;color:var(--gray-700);font-family:var(--font-body)">Carregando dashboard…</div></div>

<script>
(async function () {
  const $app = document.getElementById('app');
  let DATA;
  try {
    DATA = await fetch('data/dashboard.json?ts=' + Date.now()).then(r => r.json());
  } catch (e) {
    $app.innerHTML = '<div style="padding:40px;color:#E53A2E;font-family:Manrope">Falha ao carregar <code>data/dashboard.json</code>.</div>';
    return;
  }

  // Override de cores pra paleta Inbazz DS Core
  const INBAZZ_FARMER_COLORS = ['#14274A', '#E53A2E', '#F46557', '#2D426E', '#757575'];
  for (const k of Object.keys(DATA.marcas)) {
    DATA.marcas[k].color = '#14274A';
    (DATA.marcas[k].farmers || []).forEach((f, i) => { f.color = INBAZZ_FARMER_COLORS[i % INBAZZ_FARMER_COLORS.length]; });
  }

  const lsKey = 'iridium_inbazz_marca';
  const marcasKeys = Object.keys(DATA.marcas);
  let activeMarca = localStorage.getItem(lsKey);
  const lsKeyMes = lsKey + '_mes';
  let activeMes = localStorage.getItem(lsKeyMes) || 'atual';
  if (!marcasKeys.includes(activeMarca)) activeMarca = marcasKeys[0];


  function getProspectsTotal(sdr) { return (sdr && (sdr.prospeccoes_total ?? sdr.leads_no_mes ?? 0)) || 0; }

  function getMesesDisponiveis() {
    const out = [{ key: 'atual', label: 'Atual · ' + mesNome(DATA.meta.mesReferencia), closed: false }];
    const hist = DATA.historico || {};
    const mesesOrd = Object.keys(hist).sort().reverse();
    mesesOrd.forEach(mes => out.push({ key: mes, label: mesNome(mes) + ' (fechado)', closed: true }));
    return out;
  }
  function getMarcaData() {
    if (activeMes === 'atual') return DATA.marcas[activeMarca];
    if (DATA.historico && DATA.historico[activeMes] && DATA.historico[activeMes][activeMarca]) {
      return DATA.historico[activeMes][activeMarca];
    }
    return DATA.marcas[activeMarca]; // fallback
  }
  function isMesAtual() { return activeMes === 'atual'; }

  function fmtBRL(n) {
    if (n == null) return '—';
    if (Math.abs(n) >= 1e6) return 'R$' + (n/1e6).toFixed(1).replace('.', ',') + 'M';
    if (Math.abs(n) >= 1000) return 'R$' + (n/1000).toFixed(1).replace('.', ',') + 'k';
    return 'R$' + Math.round(n).toLocaleString('pt-BR');
  }
  function fmtBRLfull(n) {
    if (n == null) return '—';
    return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  }
  function pct(n) { return Math.round(n) + '%'; }
  function pctOne(n) { return (n == null ? '—' : n.toFixed(1).replace('.', ',') + '%'); }
  function escapeHtml(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function fmtUpdatedAt(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const dia = String(d.getDate()).padStart(2,'0');
    const mes = String(d.getMonth()+1).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    return `${dia}/${mes} ${hh}:${mm}`;
  }

  function mesNome(s) {
    const [y, m] = (s||'').split('-');
    const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    return (meses[parseInt(m,10)-1]||'') + ' ' + y;
  }
  function atingimentoColor(ratio) {
    if (ratio >= 0.85) return 'var(--green-700)';
    if (ratio >= 0.6)  return 'var(--red-500)';
    return 'var(--red-700)';
  }
  function momBadge(p, opts) { const isCurrent = (typeof isMesAtual === 'function') ? isMesAtual() : true; const da = (DATA && DATA.meta && DATA.meta.diaAtual) || 99; if (isCurrent && da <= 3) return '<span class="mom flat">início do mês</span>';
    if (p == null) return '<span class="mom flat">novo</span>';
    if (p > 0)     return `<span class="mom up">▲ ${p.toFixed(1).replace('.', ',')}%</span>`;
    if (p < 0)     return `<span class="mom down">▼ ${Math.abs(p).toFixed(1).replace('.', ',')}%</span>`;
    return '<span class="mom flat">0%</span>';
  }
  function medalIcon(t) { return t==='ouro'?'🏆':t==='prata'?'🥈':t==='bronze'?'🥉':'🎖️'; }

  function render() {
    const m = getMarcaData();
    const meta = DATA.meta || {};

    $app.innerHTML = `
      <div class="topbar">
        <div class="brand">
          <div class="brand-logo">${m.logoEmoji}</div>
          <div class="brand-meta">
            <h1>${escapeHtml(m.name)}</h1>
            <p>Dashboard UGC · Gestão de Creators</p>
          </div>
          <div class="brand-selector" role="tablist">${marcasKeys.map(k => `<button data-k="${k}" class="${k===activeMarca?'active':''}">${escapeHtml(DATA.marcas[k].name)}</button>`).join('')}</div>
          <div class="month-selector">
            <select data-month-select aria-label="Mês de referência">${(typeof getMesesDisponiveis === 'function' ? getMesesDisponiveis() : [{key:'atual',label:'Atual'}]).map(o => `<option value="${o.key}" ${o.key===activeMes?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select>
          </div>
          ${typeof isMesAtual === 'function' && !isMesAtual() ? '<span class="closed-badge">mês fechado · histórico</span>' : ''}
          
        </div>
        <div class="live"><span class="dot"></span><span title="Pipeline roda a cada 4 horas (00/04/08/12/16/20 BRT). Snapshot mais recente abaixo.">Atualizado a cada 4h · último: ${fmtUpdatedAt(meta.geradoEm)}</span></div>
      </div>

      <div class="section-label">Visão Geral do Mês</div>
      <div class="grid row-overview">
        <div class="card"><h3><span>Evolução — Meta vs Realizado</span></h3>${renderLineChart(m)}</div>
        ${renderDonutFat(m)}
        ${renderDonutCreators('Creators que Venderam', m.creators_que_venderam, m.creators_total, 'Venderam', 'Não vend.', 'oxford')}
        ${renderDonutCreators('Creators que Postaram', m.creators_que_postaram, m.creators_total, 'Postaram', 'Não post.', 'cinnabar')}
      </div>

      <div class="grid row-kpis-extra">
        <div class="card"><h3>Ticket Médio</h3><div class="big">${fmtBRLfull(m.ticket_medio)}</div><div class="lbl">${m.pedidos_total} pedidos no mês</div></div>
        <div class="card bignum-card dorm"><h3>Creators Dormentes</h3><div class="big">${m.creators_dormentes}</div><div class="lbl">aprovados há +30d sem venda — oportunidade</div></div>
        <div class="card"><h3>Conversão de Leads</h3><div class="big" style="color:${atingimentoColor(m.sdr.conversao_pct/100)}">${pctOne(m.sdr.conversao_pct)}</div><div class="lbl">${m.sdr.convertidos} de ${getProspectsTotal(m.sdr)} converteram</div></div>
        <div class="card"><h3>Tempo até 1ª Venda</h3><div class="big">${(m.sdr.dias_medios_1venda||0).toFixed(1).replace('.', ',')}<span style="font-size:18px;color:var(--gray-700);margin-left:6px">dias</span></div><div class="lbl">média dos leads convertidos</div></div>
      </div>

      <div class="section-label">Performance Individual — Farmers</div>
      <div class="grid row-farmers">
        <div class="card"><h3>Faturamento por Farmer</h3>${renderBarsFaturamento(m)}</div>
        <div class="card"><h3>Creators — Total vs Venderam</h3>${renderBarsCreatorsVenderam(m)}</div>
      </div>

      <div class="grid row-ranking-efic">
        <div class="card"><h3>🏆 Ranking de Farmers · ${escapeHtml(mesNome(meta.mesReferencia))}</h3>${renderRanking(m)}</div>
        <div class="card"><h3>Eficiência por Farmer</h3>${renderEficiencia(m)}</div>
      </div>

      <div class="grid row-pareto">
        ${m.farmers.map(f => `<div class="card"><h3>Distribuição de Receita — ${escapeHtml(f.nome.toUpperCase())} (Top Creators)</h3>${renderPareto(f)}</div>`).join('')}
      </div>

      <div class="section-label">SDR — Prospecção de Novos Creators</div>
      <div class="grid row-sdr">
        <div class="card bignum-card"><h3>Prospecções no Mês</h3><div class="big-bignumber">${getProspectsTotal(m.sdr)}</div><div class="big-sub">leads geradas</div><div class="meta-progress"><span style="color:var(--gray-700)">Meta: ${m.sdr.meta}</span><span style="color:var(--gray-500)">·</span><span class="pct" style="color:${atingimentoColor(getProspectsTotal(m.sdr)/m.sdr.meta)}">${pct(100*getProspectsTotal(m.sdr)/m.sdr.meta)}</span></div></div>
        <div class="card"><h3>Funil de Conversão</h3><div style="display:flex;align-items:baseline;gap:8px;margin-top:4px"><span style="font-family:var(--font-display);font-size:42px;font-weight:800;line-height:1;color:${atingimentoColor(m.sdr.conversao_pct/100)}">${pctOne(m.sdr.conversao_pct)}</span><span style="color:var(--gray-700);font-size:13px">lead → 1ª venda</span></div><div class="conv-stats"><div class="row"><span>Leads no mês</span><strong>${getProspectsTotal(m.sdr)}</strong></div><div class="row"><span>Converteram</span><strong>${m.sdr.convertidos}</strong></div><div class="row"><span>Tempo médio</span><strong>${(m.sdr.dias_medios_1venda||0).toFixed(1).replace('.', ',')} dias</strong></div></div></div>
        <div class="card"><h3>Distribuição de Leads por Farmer</h3>${renderLeadsByFarmer(m)}</div>
      </div>
    `;

    document.querySelectorAll('.brand-selector button').forEach(btn => {
      btn.onclick = () => { activeMarca = btn.dataset.k; localStorage.setItem(lsKey, activeMarca); render(); };
    });
    const $monthSel = document.querySelector('[data-month-select]');
    if ($monthSel) $monthSel.onchange = () => { activeMes = $monthSel.value; try { localStorage.setItem(lsKeyMes, activeMes); } catch(e){} render(); };
  }

  function renderLineChart(m) {
    const evo = m.evolucao_diaria || [];
    const diasNoMes = DATA.meta.diasNoMes || 31;
    const metaMensal = m.meta_mensal || 0;
    const maxY = Math.max(metaMensal, ...evo.map(p => p.realizado_acumulado||0));
    const W=600,H=170,PADL=32,PADR=16,PADT=18,PADB=22;
    const innerW=W-PADL-PADR, innerH=H-PADT-PADB;
    const xFor = d => PADL + ((d-1)/(diasNoMes-1))*innerW;
    const yFor = v => PADT + innerH - (v/(maxY||1))*innerH;
    const metaPts=[]; for (let d=1;d<=diasNoMes;d++) metaPts.push({x:xFor(d),y:yFor(metaMensal*d/diasNoMes)});
    const metaPath = metaPts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    const realPts = evo.map(p=>({x:xFor(p.dia),y:yFor(p.realizado_acumulado)}));
    const realPath = realPts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    const areaPath = realPath+' L'+realPts.at(-1).x.toFixed(1)+','+(PADT+innerH)+' L'+realPts[0].x.toFixed(1)+','+(PADT+innerH)+' Z';
    const xTicks=[1,5,9,13,17,21,25,29];
    return `
      <div class="legend">${metaMensal?`<span><span class="swatch dashed"></span> Meta mensal</span>`:''}<span><span class="swatch" style="background:var(--red-700)"></span> Realizado</span></div>
      <div class="chart chart-wrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E53A2E" stop-opacity="0.20"/><stop offset="100%" stop-color="#E53A2E" stop-opacity="0"/></linearGradient></defs>
        <path d="${areaPath}" fill="url(#areaFill)"/>
        ${metaMensal?`<path d="${metaPath}" stroke="#14274A" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>`:''}
        <path d="${realPath}" stroke="#E53A2E" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        ${realPts.filter((_,i)=>i%4===0).map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="#FFFFFF" stroke="#E53A2E" stroke-width="1.8"/>`).join('')}
        ${xTicks.map(d=>`<text x="${xFor(d)}" y="${H-4}" text-anchor="middle">${d}</text>`).join('')}
      </svg></div>`;
  }

  function renderDonutFat(m) {
    const real = m.faturamento_total||0, metaM = m.meta_mensal||0;
    const faltante = Math.max(0, metaM-real);
    const atingPct = metaM ? (real/metaM*100) : 0;
    const segs = metaM ? [{v:real,color:'#14274A'},{v:faltante,color:'#EDEAE7'}] : [{v:1,color:'#14274A'}];
    return `
      <div class="card">
        <h3><span>Faturamento Total</span>${momBadge(m.mom_pct, {suppressEarly: true})}</h3>
        <div class="donut-row">${renderDonutSvg(segs)}
          <div class="donut-legend">
            <div class="line"><span class="sw" style="background:#14274A"></span><strong>${fmtBRL(real)}</strong></div>
            <small>Realizado</small>
            ${metaM?`<div class="line" style="margin-top:6px"><span class="sw" style="background:#EDEAE7"></span><strong>${fmtBRL(faltante)}</strong></div><small>Faltante</small>`:''}
          </div>
        </div>
        ${metaM?`<div class="donut-foot">Meta <strong>${fmtBRL(metaM)}</strong> · <span style="color:${atingimentoColor(real/metaM)};font-weight:700">${pct(atingPct)}</span> · M-1: <strong>${fmtBRL(m.faturamento_m1)}</strong></div>`:''}
      </div>`;
  }

  function renderDonutCreators(title, value, total, labelOn, labelOff, tone) {
    const off = Math.max(0, total-value);
    const onPct = total ? (value/total*100) : 0;
    const color = tone==='oxford' ? '#14274A' : '#E53A2E';
    const segs = [{v:value,color},{v:off,color:'#EDEAE7'}];
    return `
      <div class="card">
        <h3>${escapeHtml(title)}</h3>
        <div class="donut-row">${renderDonutSvg(segs)}
          <div class="donut-legend">
            <div class="line"><span class="sw" style="background:${color}"></span><strong>${labelOn}</strong></div>
            <small><strong style="color:var(--blue-900)">${value}</strong> · ${pct(onPct)}</small>
            <div class="line" style="margin-top:6px"><span class="sw" style="background:#EDEAE7"></span><strong>${labelOff}</strong></div>
            <small><strong style="color:var(--blue-900)">${off}</strong> · ${pct(100-onPct)}</small>
          </div>
        </div>
        <div class="donut-foot">Total <strong>${total}</strong> creators aprovados</div>
      </div>`;
  }

  function renderDonutSvg(segs) {
    const total = segs.reduce((s,x)=>s+(x.v||0),0)||1;
    const r=40,cx=50,cy=50,w=13, C=2*Math.PI*r; let offset=0;
    return `<svg class="donut-svg" viewBox="0 0 100 100">${segs.map(s=>{
      const len=(s.v/total)*C;
      const ring=`<circle r="${r}" cx="${cx}" cy="${cy}" stroke="${s.color}" stroke-width="${w}" fill="none" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
      offset+=len; return ring;
    }).join('')}</svg>`;
  }

  function renderBarsFaturamento(m) {
    const farmers = m.farmers || [];
    const maxV = Math.max(1, ...farmers.map(f=>f.faturamento||0));
    const H=200;
    return `<div class="bars-grouped">${farmers.map(f=>{
      const h = (f.faturamento/maxV)*(H-50);
      const momClass = f.mom_pct==null?'flat':f.mom_pct>0?'up':f.mom_pct<0?'down':'flat';
      const isCurAndEarly = (typeof isMesAtual === 'function' && isMesAtual() && (DATA.meta.diaAtual||99) <= 3);
      const momTxt = isCurAndEarly ? 'início' : (f.mom_pct==null?'novo':(f.mom_pct>0?'▲ ':'▼ ')+Math.abs(f.mom_pct).toFixed(1).replace('.', ',')+'%');
      const momClassEff = isCurAndEarly ? 'flat' : momClass;
      return `<div class="bar-col"><div class="bar-stack"><div class="bar" style="height:${h}px;background:${f.color}"><div class="bar-value">${fmtBRL(f.faturamento)}</div><div class="bar-mom mom ${typeof momClassEff !== "undefined" ? momClassEff : momClass}">${momTxt}</div></div></div><div class="bar-label">${escapeHtml(f.nome)}</div></div>`;
    }).join('')}</div>`;
  }

  function renderBarsCreatorsVenderam(m) {
    const farmers = m.farmers || [];
    const maxV = Math.max(1, ...farmers.map(f=>f.creators_total||0));
    const H=200;
    return `<div class="bars-grouped">${farmers.map(f=>{
      const hT = (f.creators_total/maxV)*(H-40);
      const hV = (f.creators_que_venderam/maxV)*(H-40);
      return `<div class="bar-col"><div class="bar-stack">
        <div class="bar bar-track" style="height:${hT}px;width:38px"><div class="bar-value">${f.creators_total}</div></div>
        <div class="bar" style="height:${hV}px;width:38px;background:#14274A"><div class="bar-value" style="color:#FFFFFF;background:#14274A;padding:2px 6px;border-radius:4px;top:-26px">${f.creators_que_venderam}</div></div>
      </div><div class="bar-label">${escapeHtml(f.nome)}</div></div>`;
    }).join('')}</div>`;
  }

  function renderPareto(farmer) {
    const tops = (farmer.top_creators||[]).slice(0,8);
    if (!tops.length) return '<div style="color:var(--gray-700);font-size:12px">Sem dados</div>';
    const W=520,H=240,PADL=30,PADR=30,PADT=26,PADB=36;
    const innerW=W-PADL-PADR, innerH=H-PADT-PADB;
    const slot=innerW/tops.length, barW=slot*0.65;
    const maxV=Math.max(...tops.map(t=>t.receita));
    const total=tops.reduce((s,t)=>s+t.receita,0);
    let acc=0;
    const points=tops.map((t,i)=>{acc+=t.receita; return {cx:PADL+slot*i+slot/2, cy:PADT+innerH-(acc/total)*innerH, label:Math.round(acc/total*100)+'%'};});
    const linePath = points.map((p,i)=>(i===0?'M':'L')+p.cx.toFixed(1)+','+p.cy.toFixed(1)).join(' ');
    return `<div class="pareto-wrap"><svg class="pareto-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${tops.map((t,i)=>{
        const cx=PADL+slot*i+slot/2;
        const barH=(t.receita/maxV)*innerH;
        const x=cx-barW/2, y=PADT+innerH-barH;
        return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${farmer.color}"/>
          <text x="${cx}" y="${(y-6).toFixed(1)}" text-anchor="middle" style="fill:var(--blue-900);font-family:var(--font-display);font-weight:700;font-size:11px">${fmtBRL(t.receita)}</text>
          <text x="${cx}" y="${H-10}" text-anchor="middle">${escapeHtml(t.id)}</text>`;
      }).join('')}
      <path d="${linePath}" stroke="#14274A" stroke-opacity="0.55" stroke-width="1.4" fill="none"/>
      ${points.map(p=>`<circle cx="${p.cx}" cy="${p.cy}" r="3" fill="#FFFFFF" stroke="#14274A" stroke-width="1.4"/><text x="${p.cx+8}" y="${p.cy-6}" style="fill:var(--gray-700);font-size:10.5px">${p.label}</text>`).join('')}
    </svg></div>`;
  }

  function renderRanking(m) {
    const ranking = m.ranking_farmers || [];
    if (!ranking.length) return '<div style="color:var(--gray-700);font-size:12px">Sem dados</div>';
    return `<div class="podium">${ranking.map(r=>`
      <div class="podium-row ${r.trofeu}">
        <div><div class="podium-medal">${medalIcon(r.trofeu)}</div><div class="podium-pos" style="text-align:center">${r.posicao}º LUGAR</div></div>
        <div><div class="podium-name">${escapeHtml(r.nome)}</div><div>${momBadge(r.mom_pct)}</div></div>
        <div><div class="podium-fat">${fmtBRL(r.faturamento)}</div></div>
      </div>`).join('')}</div>`;
  }

  function renderEficiencia(m) {
    const farmers = (m.farmers||[]).slice().sort((a,b)=>(b.faturamento||0)-(a.faturamento||0));
    return `<div class="efic-table">
      <div class="efic-head">
        <div>Farmer</div>
        <div style="text-align:right">Faturamento</div>
        <div style="text-align:right">Ticket Médio</div>
        <div style="text-align:right">Ativos</div>
      </div>
      ${farmers.map(f=>`<div class="efic-row">
        <div class="farmer-tag"><span class="dot" style="background:${f.color}"></span><strong>${escapeHtml(f.nome)}</strong></div>
        <div style="text-align:right" class="efic-num">${fmtBRL(f.faturamento)}</div>
        <div style="text-align:right" class="efic-num">${fmtBRLfull(f.ticket_medio)}</div>
        <div style="text-align:right" class="efic-num">${f.creators_que_venderam}<span style="color:var(--gray-700);font-weight:500"> / ${f.creators_total}</span></div>
      </div>`).join('')}
    </div>`;
  }

  function renderLeadsByFarmer(m) {
    const farmers = m.farmers || [];
    const max = Math.max(1, ...farmers.map(f=>f.leads_no_mes||0));
    return `<div class="leads-row">${farmers.map(f=>{
      const w=((f.leads_no_mes||0)/max)*100;
      return `<div class="lead-bar-row"><div class="lead-name">${escapeHtml(f.nome)}</div><div class="lead-track"><div class="lead-fill" style="width:${w}%;background:${f.color}"></div></div><div class="lead-count">${f.leads_no_mes} leads</div></div>`;
    }).join('')}</div>`;
  }

  render();
})();
</script>
</body>
</html>
