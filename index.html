<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iridium · Dashboard UGC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E13;
    --bg-2: #0F141B;
    --card: #161B22;
    --card-2: #1C232C;
    --border: #232A33;
    --text: #E6EDF3;
    --muted: #8B949E;
    --dim: #6B7280;
    --green: #22C55E;
    --green-soft: rgba(34,197,94,.15);
    --orange: #F97316;
    --orange-soft: rgba(249,115,22,.15);
    --blue: #3B82F6;
    --blue-soft: rgba(59,130,246,.15);
    --red: #EF4444;
    --red-soft: rgba(239,68,68,.15);
    --purple: #A855F7;
    --yellow: #F59E0B;
    --track: #232A33;
    --gold:   #FACC15;
    --silver: #CBD5E1;
    --bronze: #FB923C;
    --shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0; padding: 0; font-family: 'Manrope', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; padding: 28px 36px 64px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 22px; border-bottom: 1px solid var(--border); margin-bottom: 28px; gap: 24px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand-logo { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; box-shadow: var(--shadow); }
  .brand-meta h1 { font-weight: 700; font-size: 28px; margin: 0 0 4px; letter-spacing: -.02em; line-height: 1; }
  .brand-meta p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .brand-selector { display: flex; gap: 6px; margin-left: 18px; padding: 4px; background: var(--card); border-radius: 10px; border: 1px solid var(--border); }
  .brand-selector button { background: transparent; color: var(--muted); border: 0; padding: 7px 14px; border-radius: 7px; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; transition: all .15s; }
  .brand-selector button:hover { color: var(--text); }
  .brand-selector button.active { background: var(--card-2); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,.04) inset; }
  .live { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(34,197,94,.15); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 4px rgba(34,197,94,.15); } 50% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } }

  .section-label { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin: 32px 0 14px; }
  .section-label:first-of-type { margin-top: 4px; }

  .grid { display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .card h3 { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card h3 .mom { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0; }
  .mom.up   { background: var(--green-soft); color: var(--green); }
  .mom.down { background: var(--red-soft);   color: var(--red); }
  .mom.flat { background: rgba(139,148,158,.15); color: var(--muted); }

  .row-overview { display: grid; grid-template-columns: 1.55fr 1fr 1fr 1fr; gap: 16px; }
  .row-overview .card { min-height: 240px; }

  .row-kpis-extra { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 16px; }
  .kpi-card .big { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .kpi-card .lbl { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .kpi-card .delta { font-size: 12px; margin-top: 8px; }

  .row-afiliados { display: grid; grid-template-columns: 0.7fr 1fr 1fr; gap: 16px; margin-top: 16px; }
  .row-farmers { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .row-ranking-efic { display: grid; grid-template-columns: 0.95fr 1.05fr; gap: 16px; margin-top: 16px; }
  .row-pareto { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .row-sdr { display: grid; grid-template-columns: 0.45fr 0.55fr 1fr; gap: 16px; }

  @media (max-width: 1180px) {
    .row-overview, .row-kpis-extra, .row-sdr, .row-afiliados { grid-template-columns: 1fr 1fr; }
    .row-overview > .card:first-child { grid-column: 1 / -1; }
    .row-ranking-efic { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    body { padding: 18px; }
    .row-overview, .row-farmers, .row-pareto, .row-sdr, .row-kpis-extra, .row-ranking-efic, .row-afiliados { grid-template-columns: 1fr; }
    .topbar { flex-direction: column; align-items: flex-start; }
  }

  /* === LINE === */
  .legend { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .legend .swatch { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
  .legend .dashed { background: repeating-linear-gradient(90deg, var(--blue) 0 4px, transparent 4px 8px); height: 2px; }
  .chart svg { width: 100%; height: 100%; display: block; }
  .chart-wrap { width: 100%; height: 180px; }

  /* === DONUTS === */
  .donut-row { display: flex; align-items: center; gap: 16px; }
  .donut-svg { width: 110px; height: 110px; flex-shrink: 0; }
  .donut-legend { font-size: 12.5px; color: var(--text); display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  .donut-legend .line { display: flex; align-items: baseline; gap: 6px; }
  .donut-legend .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  .donut-legend strong { font-size: 14px; font-weight: 700; }
  .donut-legend small { color: var(--muted); font-size: 11.5px; }
  .donut-foot { margin-top: 14px; font-size: 12px; color: var(--muted); padding-top: 12px; border-top: 1px dashed var(--border); }
  .donut-foot strong { color: var(--text); }

  /* === BARS === */
  .bars-grouped { display: flex; align-items: end; justify-content: space-around; height: 200px; padding: 8px 12px 36px; position: relative; }
  .bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; min-width: 0; position: relative; }
  .bar-stack { display: flex; align-items: end; gap: 8px; height: 100%; width: 100%; justify-content: center; }
  .bar { width: 44px; border-radius: 8px 8px 4px 4px; position: relative; transition: transform .2s; }
  .bar:hover { transform: translateY(-3px); filter: brightness(1.15); }
  .bar-value { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--text); }
  .bar-mom { position: absolute; top: -42px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 700; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
  .bar-label { font-size: 12.5px; font-weight: 600; color: var(--muted); position: absolute; bottom: -28px; text-align: center; width: 100%; }
  .bar-track { background: var(--track); }

  /* === PARETO === */
  .pareto-wrap { width: 100%; height: 260px; }
  .pareto-svg { width: 100%; height: 100%; }

  /* === RANKING GAMIFICADO === */
  .podium { display: flex; flex-direction: column; gap: 10px; }
  .podium-row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--border); transition: transform .2s; }
  .podium-row:hover { transform: translateX(2px); }
  .podium-row.gold   { background: linear-gradient(90deg, rgba(250,204,21,.10), rgba(250,204,21,0)); border-color: rgba(250,204,21,.35); }
  .podium-row.silver { background: linear-gradient(90deg, rgba(203,213,225,.08), rgba(203,213,225,0)); border-color: rgba(203,213,225,.25); }
  .podium-row.bronze { background: linear-gradient(90deg, rgba(251,146,60,.08), rgba(251,146,60,0)); border-color: rgba(251,146,60,.25); }
  .podium-row.sem-farmer { background: repeating-linear-gradient(45deg, rgba(139,148,158,.04), rgba(139,148,158,.04) 6px, transparent 6px, transparent 12px), var(--card-2); border-color: rgba(139,148,158,.25); border-style: dashed; }
  .podium-row.sem-farmer .podium-pos { color: var(--red); }
  .podium-medal { font-size: 26px; line-height: 1; text-align: center; }
  .podium-pos { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .podium-name { font-size: 16px; font-weight: 700; color: var(--text); margin-top: 2px; line-height: 1.1; }
  .podium-fat { font-size: 18px; font-weight: 800; text-align: right; line-height: 1; }
  .podium-mom { font-size: 11px; font-weight: 700; margin-top: 4px; padding: 2px 6px; border-radius: 4px; display: inline-block; }

  /* === EFICIÊNCIA TABLE === */
  .efic-table { display: grid; gap: 6px; font-size: 12.5px; }
  .efic-head, .efic-row { display: grid; grid-template-columns: 1.3fr 1fr 1fr 0.9fr; gap: 8px; padding: 8px 10px; border-radius: 8px; align-items: center; }
  .efic-head { color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: transparent; padding-bottom: 4px; }
  .efic-row { background: var(--card-2); border: 1px solid var(--border); }
  .efic-row strong { font-weight: 700; color: var(--text); }
  .efic-row .farmer-tag { display: inline-flex; align-items: center; gap: 8px; }
  .efic-row .farmer-tag .dot { width: 8px; height: 8px; border-radius: 50%; }
  .efic-num { font-variant-numeric: tabular-nums; font-weight: 700; }

  /* === SDR === */
  .big-bignumber { font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -.03em; margin: 4px 0 4px; }
  .big-sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .meta-progress { display: flex; align-items: center; gap: 10px; font-size: 12.5px; flex-wrap: wrap; }
  .meta-progress .pct { font-weight: 700; }
  .leads-row { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
  .lead-bar-row { display: grid; grid-template-columns: 100px 1fr auto; gap: 12px; align-items: center; }
  .lead-name { font-size: 13.5px; font-weight: 600; color: var(--text); }
  .lead-track { background: var(--track); border-radius: 999px; height: 14px; overflow: hidden; }
  .lead-fill { height: 100%; border-radius: 999px; transition: width .6s; }
  .lead-count { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .conv-stats { display: grid; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .conv-stats .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
  .conv-stats .row strong { color: var(--text); font-weight: 700; }

  .bignum-card.warn { background: linear-gradient(180deg, rgba(249,115,22,.07), rgba(249,115,22,0)); border-color: rgba(249,115,22,.25); }
  .bignum-card.dorm { background: linear-gradient(180deg, rgba(239,68,68,.07), rgba(239,68,68,0)); border-color: rgba(239,68,68,.25); }

  svg text { fill: var(--muted); font-family: 'Manrope', sans-serif; font-size: 10.5px; }

  .center-state { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }
  .center-state.err { color: var(--red); }

.month-selector { display: flex; gap: 4px; padding: 3px; border-radius: 10px; margin-left: 6px; }
.month-selector select { background: transparent; border: 0; color: inherit; font: inherit; font-weight: 600; font-size: 12.5px; padding: 6px 28px 6px 12px; border-radius: 7px; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238B949E' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 10px center; }
.month-selector select:focus { outline: 1px solid currentColor; outline-offset: 1px; }
.closed-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; letter-spacing: .04em; text-transform: uppercase; }

.month-selector { background: var(--card); border: 1px solid var(--border); }
.month-selector select { color: var(--text); }
.closed-badge { background: rgba(139,148,158,.15); color: var(--muted); }

</style>
</head>
<body>

<div id="app">
  <div class="center-state">Carregando dashboard…</div>
</div>

<script>
(async function () {
  const $app = document.getElementById('app');
  let DATA;
  try {
    DATA = await fetch('data/dashboard.json?ts=' + Date.now()).then(r => r.json());
  } catch (e) {
    $app.innerHTML = '<div class="center-state err">Falha ao carregar data/dashboard.json — verifique se o arquivo existe.</div>';
    return;
  }

  const lsKey = 'iridium_dash_marca';
  const marcasKeys = Object.keys(DATA.marcas);
  let activeMarca = localStorage.getItem(lsKey);
  const lsKeyMes = lsKey + '_mes';
  let activeMes = localStorage.getItem(lsKeyMes) || 'atual';
  if (!marcasKeys.includes(activeMarca)) activeMarca = marcasKeys[0];

  // ====== utils ======

  function getProspectsTotal(sdr) { return (sdr && (sdr.prospeccoes_total ?? sdr.leads_no_mes ?? 0)) || 0; }

  function getMesesDisponiveis() {
    const out = [{ key: 'atual', label: 'Atual · ' + mesNome(DATA.meta.mesReferencia), closed: false }];
    const hist = DATA.historico || {};
    const mesesOrd = Object.keys(hist).sort().reverse();
    mesesOrd.forEach(mes => out.push({ key: mes, label: mesNome(mes) + ' (fechado)', closed: true }));
    return out;
  }
  function getMarcaData() {
    if (activeMes === 'atual') return DATA.marcas[activeMarca];
    if (DATA.historico && DATA.historico[activeMes] && DATA.historico[activeMes][activeMarca]) {
      return DATA.historico[activeMes][activeMarca];
    }
    return DATA.marcas[activeMarca]; // fallback
  }
  function isMesAtual() { return activeMes === 'atual'; }

  function fmtBRL(n) {
    if (n == null) return '—';
    if (Math.abs(n) >= 1e6) return 'R$' + (n / 1e6).toFixed(1).replace('.', ',') + 'M';
    if (Math.abs(n) >= 1000) return 'R$' + (n / 1000).toFixed(1).replace('.', ',') + 'k';
    return 'R$' + Math.round(n).toLocaleString('pt-BR');
  }
  function fmtBRLfull(n) {
    if (n == null) return '—';
    return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  }
  function pct(n) { return Math.round(n) + '%'; }
  function pctOne(n) { return (n == null ? '—' : n.toFixed(1).replace('.', ',') + '%'); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtUpdatedAt(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const dia = String(d.getDate()).padStart(2,'0');
    const mes = String(d.getMonth()+1).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    return `${dia}/${mes} ${hh}:${mm}`;
  }

  function mesNome(s) {
    const [y, m] = (s || '').split('-');
    const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    return (meses[parseInt(m,10)-1] || '') + ' ' + y;
  }
  function atingimentoColor(ratio) {
    if (ratio >= 0.85) return 'var(--green)';
    if (ratio >= 0.6)  return 'var(--orange)';
    return 'var(--red)';
  }
  function momBadge(p, opts) { const isCurrent = (typeof isMesAtual === 'function') ? isMesAtual() : true; const da = (DATA && DATA.meta && DATA.meta.diaAtual) || 99; if (isCurrent && da <= 3) return '<span class="mom flat">início do mês</span>';
    if (p == null) return '<span class="mom flat">novo</span>';
    if (p > 0)     return `<span class="mom up">▲ ${p.toFixed(1).replace('.', ',')}%</span>`;
    if (p < 0)     return `<span class="mom down">▼ ${Math.abs(p).toFixed(1).replace('.', ',')}%</span>`;
    return '<span class="mom flat">0%</span>';
  }
  function medalIcon(trofeu) {
    if (trofeu === 'ouro')   return '🏆';
    if (trofeu === 'prata')  return '🥈';
    if (trofeu === 'bronze') return '🥉';
    return '🎖️';
  }

  // ====== render ======
  function render() {
    const m = getMarcaData();
    const meta = DATA.meta || {};

    $app.innerHTML = `
      <div class="topbar">
        <div class="brand">
          <div class="brand-logo" style="background:${m.color}22;color:${m.color}">${m.logoEmoji}</div>
          <div class="brand-meta">
            <h1>${escapeHtml(m.name)}</h1>
            <p>Dashboard UGC · Gestão de Creators</p>
          </div>
          <div class="brand-selector" role="tablist">${marcasKeys.map(k => `<button data-k="${k}" class="${k===activeMarca?'active':''}">${escapeHtml(DATA.marcas[k].name)}</button>`).join('')}</div>
          <div class="month-selector">
            <select data-month-select aria-label="Mês de referência">${(typeof getMesesDisponiveis === 'function' ? getMesesDisponiveis() : [{key:'atual',label:'Atual'}]).map(o => `<option value="${o.key}" ${o.key===activeMes?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select>
          </div>
          ${typeof isMesAtual === 'function' && !isMesAtual() ? '<span class="closed-badge">mês fechado · histórico</span>' : ''}
          
        </div>
        <div class="live">
          <span class="dot"></span>
          <span title="Pipeline roda a cada 4 horas (00/04/08/12/16/20 BRT). Snapshot mais recente abaixo.">Atualizado a cada 4h · último: ${fmtUpdatedAt(meta.geradoEm)}</span>
        </div>
      </div>

      <div class="section-label">Performance Individual — Farmers</div>
      <div class="grid row-farmers">
        <div class="card">
          <h3>Faturamento por Farmer</h3>
          ${renderBarsFaturamento(m)}
        </div>
        <div class="card">
          <h3>Creators — Total vs Venderam</h3>
          ${renderBarsCreatorsVenderam(m)}
        </div>
      </div>

      <div class="grid row-ranking-efic">
        <div class="card">
          <h3>🏆 Ranking de Farmers · ${escapeHtml(mesNome(meta.mesReferencia))}</h3>
          ${renderRanking(m)}
        </div>
        <div class="card">
          <h3>Eficiência por Farmer</h3>
          ${renderEficiencia(m)}
        </div>
      </div>

      <div class="grid row-pareto">
        ${m.farmers.map(f => `
          <div class="card">
            <h3>Distribuição de Receita — ${escapeHtml(f.nome.toUpperCase())} (Top Creators)</h3>
            ${renderPareto(f)}
          </div>
        `).join('')}
      </div>

      <div class="section-label">Visão Geral do Mês — Creators</div>
      <div class="grid row-overview">
        <div class="card">
          <h3><span>Evolução — Meta vs Realizado</span></h3>
          ${renderLineChart(m)}
        </div>
        ${renderDonutFat(m)}
        ${renderDonutCreators('Creators que Venderam', m.creators_que_venderam, m.creators_total, 'Venderam', 'Não vend.', 'green', 'creators')}
        ${renderDonutCreators('Creators que Postaram', m.creators_que_postaram, m.creators_total, 'Postaram', 'Não post.', 'orange', 'creators')}
      </div>

      <div class="grid row-kpis-extra">
        <div class="card kpi-card">
          <h3>Ticket Médio</h3>
          <div class="big">${fmtBRLfull(m.ticket_medio)}</div>
          <div class="lbl">${m.pedidos_total} pedidos de creators no mês</div>
        </div>
        <div class="card kpi-card bignum-card dorm">
          <h3>Creators Dormentes</h3>
          <div class="big" style="color:var(--red)">${m.creators_dormentes}</div>
          <div class="lbl">creators aprovados há +30d sem venda no mês — oportunidade</div>
        </div>
        <div class="card kpi-card">
          <h3>Conversão de Leads</h3>
          <div class="big" style="color:${atingimentoColor(m.sdr.conversao_pct/100)}">${pctOne(m.sdr.conversao_pct)}</div>
          <div class="lbl">${m.sdr.convertidos} de ${getProspectsTotal(m.sdr)} leads converteram</div>
        </div>
        <div class="card kpi-card">
          <h3>Tempo até 1ª Venda</h3>
          <div class="big">${(m.sdr.dias_medios_1venda || 0).toFixed(1).replace('.', ',')}<span style="font-size:18px;color:var(--muted);margin-left:6px">dias</span></div>
          <div class="lbl">média dos leads que converteram</div>
        </div>
      </div>

      <div class="section-label">SDR — Prospecção de Novos Creators</div>
      <div class="grid row-sdr">
        <div class="card bignum-card warn">
          <h3>Prospecções no Mês</h3>
          <div class="big-bignumber" style="color:${m.color}">${getProspectsTotal(m.sdr)}</div>
          <div class="big-sub">leads geradas</div>
          <div class="meta-progress">
            <span>Meta: ${m.sdr.meta}</span>
            <span style="color:var(--dim)">·</span>
            <span class="pct" style="color:${atingimentoColor(getProspectsTotal(m.sdr) / m.sdr.meta)}">${pct(100 * getProspectsTotal(m.sdr) / m.sdr.meta)}</span>
          </div>
        </div>
        <div class="card">
          <h3>Funil de Conversão</h3>
          <div style="display:flex;align-items:baseline;gap:8px;margin-top:4px">
            <span style="font-size:42px;font-weight:800;line-height:1;color:${atingimentoColor(m.sdr.conversao_pct/100)}">${pctOne(m.sdr.conversao_pct)}</span>
            <span style="color:var(--muted);font-size:13px">lead → 1ª venda</span>
          </div>
          <div class="conv-stats">
            <div class="row"><span>Leads no mês</span> <strong>${getProspectsTotal(m.sdr)}</strong></div>
            <div class="row"><span>Converteram</span> <strong>${m.sdr.convertidos}</strong></div>
            <div class="row"><span>Tempo médio</span> <strong>${(m.sdr.dias_medios_1venda || 0).toFixed(1).replace('.', ',')} dias</strong></div>
          </div>
        </div>
        <div class="card">
          <h3>Distribuição de Leads por Farmer</h3>
          ${renderLeadsByFarmer(m)}
        </div>
      </div>
    `;

    document.querySelectorAll('.brand-selector button').forEach(btn => {
      btn.onclick = () => {
        activeMarca = btn.dataset.k;
        localStorage.setItem(lsKey, activeMarca);
        render();
      };
    });
  }

  // ============== LINE CHART ==============
  function renderLineChart(m) {
    const evo = m.evolucao_diaria || [];
    const diasNoMes = DATA.meta.diasNoMes || 31;
    const metaMensal = m.meta_mensal || 0;
    const maxY = Math.max(metaMensal, ...evo.map(p => p.realizado_acumulado || 0));
    const W = 600, H = 180, PADL = 32, PADR = 16, PADT = 18, PADB = 24;
    const innerW = W - PADL - PADR;
    const innerH = H - PADT - PADB;
    const xFor = d => PADL + ((d - 1) / (diasNoMes - 1)) * innerW;
    const yFor = v => PADT + innerH - (v / (maxY || 1)) * innerH;

    const metaLine = [];
    for (let d = 1; d <= diasNoMes; d++) metaLine.push({ x: xFor(d), y: yFor(metaMensal * (d / diasNoMes)) });
    const metaPath = metaLine.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');

    const realPoints = evo.map(p => ({ x: xFor(p.dia), y: yFor(p.realizado_acumulado) }));
    const realPath = realPoints.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const areaPath = realPath + ' L' + realPoints[realPoints.length-1].x.toFixed(1) + ',' + (PADT+innerH) + ' L' + realPoints[0].x.toFixed(1) + ',' + (PADT+innerH) + ' Z';

    const xTicks = [1, 5, 9, 13, 17, 21, 25, 29];
    return `
      <div class="legend">
        ${metaMensal ? `<span><span class="swatch dashed"></span> Meta mensal</span>` : ''}
        <span><span class="swatch" style="background:var(--green)"></span> Realizado</span>
      </div>
      <div class="chart chart-wrap">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs>
            <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#22C55E" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="${areaPath}" fill="url(#areaFill)"/>
          ${metaMensal ? `<path d="${metaPath}" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>` : ''}
          <path d="${realPath}" stroke="#22C55E" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          ${realPoints.filter((_,i) => i % 4 === 0).map(p => `<circle cx="${p.x}" cy="${p.y}" r="3" fill="#0B0E13" stroke="#22C55E" stroke-width="1.8"/>`).join('')}
          ${xTicks.map(d => `<text x="${xFor(d)}" y="${H-6}" text-anchor="middle">${d}</text>`).join('')}
        </svg>
      </div>
    `;
  }

  // ============== DONUT FATURAMENTO ==============
  function renderDonutFat(m) {
    const real = m.faturamento_total || 0;
    const metaM = m.meta_mensal || 0;
    const faltante = Math.max(0, metaM - real);
    const atingPct = metaM ? (real / metaM * 100) : 0;
    const segs = metaM
      ? [{ v: real, color: 'var(--green)' }, { v: faltante, color: 'var(--track)' }]
      : [{ v: 1, color: 'var(--green)' }];
    return `
      <div class="card">
        <h3><span>Faturamento Total</span> ${momBadge(m.mom_pct, {suppressEarly: true})}</h3>
        <div class="donut-row">
          ${renderDonutSvg(segs)}
          <div class="donut-legend">
            <div class="line"><span class="sw" style="background:var(--green)"></span> <strong>${fmtBRL(real)}</strong></div>
            <small>Realizado</small>
            ${metaM ? `
              <div class="line" style="margin-top:6px"><span class="sw" style="background:var(--track)"></span> <strong>${fmtBRL(faltante)}</strong></div>
              <small>Faltante</small>
            ` : ''}
          </div>
        </div>
        ${metaM ? `
          <div class="donut-foot">
            Meta <strong>${fmtBRL(metaM)}</strong> · <span style="color:${atingimentoColor(real/metaM)};font-weight:700">${pct(atingPct)}</span>
            · M-1: <strong>${fmtBRL(m.faturamento_m1)}</strong>
          </div>
        ` : ''}
      </div>
    `;
  }

  function renderDonutCreators(title, value, total, labelOn, labelOff, tone, footNoun) {
    const off = Math.max(0, total - value);
    const onPct = total ? (value / total * 100) : 0;
    const color = tone === 'green' ? 'var(--green)' : 'var(--orange)';
    const segs = [{ v: value, color }, { v: off, color: 'var(--track)' }];
    const noun = footNoun || 'creators aprovados';
    return `
      <div class="card">
        <h3>${escapeHtml(title)}</h3>
        <div class="donut-row">
          ${renderDonutSvg(segs)}
          <div class="donut-legend">
            <div class="line"><span class="sw" style="background:${color}"></span> <strong>${labelOn}</strong></div>
            <small><strong style="color:var(--text)">${value}</strong> · ${pct(onPct)}</small>
            <div class="line" style="margin-top:6px"><span class="sw" style="background:var(--track)"></span> <strong>${labelOff}</strong></div>
            <small><strong style="color:var(--text)">${off}</strong> · ${pct(100-onPct)}</small>
          </div>
        </div>
        <div class="donut-foot">Total <strong>${total}</strong> ${noun}</div>
      </div>
    `;
  }

  function renderDonutSvg(segs) {
    const total = segs.reduce((s, x) => s + (x.v || 0), 0) || 1;
    const r = 44, cx = 55, cy = 55, w = 14;
    const C = 2 * Math.PI * r;
    let offset = 0;
    return `<svg class="donut-svg" viewBox="0 0 110 110">${segs.map(s => {
      const len = (s.v / total) * C;
      const ring = `<circle r="${r}" cx="${cx}" cy="${cy}" stroke="${s.color}" stroke-width="${w}" fill="none" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
      offset += len;
      return ring;
    }).join('')}</svg>`;
  }

  // ============== BARS FATURAMENTO ==============
  function renderBarsFaturamento(m) {
    const farmers = m.farmers || [];
    const maxV = Math.max(1, ...farmers.map(f => f.faturamento || 0));
    const H = 200;
    return `
      <div class="bars-grouped">
        ${farmers.map(f => {
          const h = (f.faturamento / maxV) * (H - 50);
          const momClass = f.mom_pct == null ? 'flat' : f.mom_pct > 0 ? 'up' : f.mom_pct < 0 ? 'down' : 'flat';
          const momTxt = f.mom_pct == null ? 'novo' : (f.mom_pct > 0 ? '▲ ' : '▼ ') + Math.abs(f.mom_pct).toFixed(1).replace('.', ',') + '%';
          return `
            <div class="bar-col">
              <div class="bar-stack">
                <div class="bar" style="height:${h}px;background:${f.color}">
                  <div class="bar-value">${fmtBRL(f.faturamento)}</div>
                  <div class="bar-mom mom ${typeof momClassEff !== "undefined" ? momClassEff : momClass}">${momTxt}</div>
                </div>
              </div>
              <div class="bar-label">${escapeHtml(f.nome)}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function renderBarsCreatorsVenderam(m) {
    const farmers = m.farmers || [];
    const maxV = Math.max(1, ...farmers.map(f => f.creators_total || 0));
    const H = 200;
    return `
      <div class="bars-grouped">
        ${farmers.map(f => {
          const hT = (f.creators_total / maxV) * (H - 40);
          const hV = (f.creators_que_venderam / maxV) * (H - 40);
          return `
            <div class="bar-col">
              <div class="bar-stack">
                <div class="bar bar-track" style="height:${hT}px;width:38px">
                  <div class="bar-value" style="color:var(--muted)">${f.creators_total}</div>
                </div>
                <div class="bar" style="height:${hV}px;width:38px;background:var(--green)">
                  <div class="bar-value">${f.creators_que_venderam}</div>
                </div>
              </div>
              <div class="bar-label">${escapeHtml(f.nome)}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // ============== PARETO ==============
  function renderPareto(farmer) {
    const tops = (farmer.top_creators || []).slice(0, 8);
    if (!tops.length) return '<div style="color:var(--muted);font-size:12px">Sem dados</div>';
    const W = 520, H = 240, PADL = 30, PADR = 30, PADT = 26, PADB = 36;
    const innerW = W - PADL - PADR, innerH = H - PADT - PADB;
    const slot = innerW / tops.length;
    const barW = slot * 0.65;
    const maxV = Math.max(...tops.map(t => t.receita));
    const total = tops.reduce((s,t) => s + t.receita, 0);
    let acc = 0;
    const points = tops.map((t, i) => {
      acc += t.receita;
      return { cx: PADL + slot * i + slot/2, cy: PADT + innerH - (acc/total) * innerH, label: Math.round(acc/total*100) + '%' };
    });
    const linePath = points.map((p,i) => (i===0?'M':'L') + p.cx.toFixed(1) + ',' + p.cy.toFixed(1)).join(' ');
    return `
      <div class="pareto-wrap">
        <svg class="pareto-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
          ${tops.map((t, i) => {
            const cx = PADL + slot * i + slot/2;
            const barH = (t.receita / maxV) * innerH;
            const x = cx - barW/2, y = PADT + innerH - barH;
            return `
              <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${farmer.color}"/>
              <text x="${cx}" y="${(y-6).toFixed(1)}" text-anchor="middle" style="fill:var(--text);font-weight:700;font-size:11px">${fmtBRL(t.receita)}</text>
              <text x="${cx}" y="${H-8}" text-anchor="middle">${escapeHtml(t.id)}</text>
            `;
          }).join('')}
          <path d="${linePath}" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.4" fill="none"/>
          ${points.map(p => `
            <circle cx="${p.cx}" cy="${p.cy}" r="3" fill="#0B0E13" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.4"/>
            <text x="${p.cx + 8}" y="${p.cy - 6}" style="fill:var(--muted);font-size:10.5px">${p.label}</text>
          `).join('')}
        </svg>
      </div>
    `;
  }

  // ============== RANKING GAMIFICADO ==============
  function renderRanking(m) {
    const ranking = m.ranking_farmers || [];
    if (!ranking.length) return '<div style="color:var(--muted);font-size:12px">Sem dados</div>';
    return `
      <div class="podium">
        ${ranking.map(r => {
          const isSem = r.sem_farmer || r.id === 'sem_farmer';
          const cls = isSem ? 'sem-farmer' : (r.trofeu || '');
          const medal = isSem ? '❓' : medalIcon(r.trofeu);
          const posLabel = isSem ? 'SEM FARMER' : `${r.posicao}º LUGAR`;
          const subLine = isSem
            ? '<div style="font-size:11px;color:var(--muted);margin-top:4px">Sem tag de farmer — pendente Roberto/Jessica</div>'
            : momBadge(r.mom_pct);
          return `
          <div class="podium-row ${cls}">
            <div>
              <div class="podium-medal">${medal}</div>
              <div class="podium-pos" style="text-align:center">${posLabel}</div>
            </div>
            <div>
              <div class="podium-name">${escapeHtml(r.nome)}</div>
              <div>${subLine}</div>
            </div>
            <div>
              <div class="podium-fat" style="${isSem ? 'color:var(--muted)' : ''}">${fmtBRL(r.faturamento)}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    `;
  }

  // ============== EFICIÊNCIA ==============
  function renderEficiencia(m) {
    const farmers = (m.farmers || []).slice().sort((a,b) => (b.faturamento||0) - (a.faturamento||0));
    return `
      <div class="efic-table">
        <div class="efic-head">
          <div>Farmer</div>
          <div style="text-align:right">Faturamento</div>
          <div style="text-align:right">Ticket Médio</div>
          <div style="text-align:right">Ativos</div>
        </div>
        ${farmers.map(f => `
          <div class="efic-row">
            <div class="farmer-tag"><span class="dot" style="background:${f.color}"></span><strong>${escapeHtml(f.nome)}</strong></div>
            <div style="text-align:right" class="efic-num">${fmtBRL(f.faturamento)}</div>
            <div style="text-align:right" class="efic-num">${fmtBRLfull(f.ticket_medio)}</div>
            <div style="text-align:right" class="efic-num">${f.creators_que_venderam}<span style="color:var(--muted);font-weight:500"> / ${f.creators_total}</span></div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // ============== LEADS POR FARMER ==============
  function renderLeadsByFarmer(m) {
    const farmers = m.farmers || [];
    const max = Math.max(1, ...farmers.map(f => f.leads_no_mes || 0));
    return `
      <div class="leads-row">
        ${farmers.map(f => {
          const w = ((f.leads_no_mes || 0) / max) * 100;
          return `
            <div class="lead-bar-row">
              <div class="lead-name">${escapeHtml(f.nome)}</div>
              <div class="lead-track"><div class="lead-fill" style="width:${w}%;background:${f.color}"></div></div>
              <div class="lead-count">${f.leads_no_mes} leads</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  render();
})();
</script>
</body>
</html>
